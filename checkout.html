<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento seguro | Canção de Fé</title><script src="https://js.stripe.com/dahlia/stripe.js"></script><style>:root{--cream:#fffbee;--navy:#142038;--orange:#bd4b24;--line:#e3d4c4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--cream),white);color:var(--navy);font:16px Arial,sans-serif}header{text-align:center;padding:23px;font:600 28px Georgia,serif;border-bottom:1px solid var(--line)}main{max-width:790px;margin:auto;padding:35px 16px 70px}h1{text-align:center;font:600 36px Georgia,serif}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin:20px 0}.summary{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:14px}.muted{color:#63718a;line-height:1.6}.error{color:#a32622}a{color:var(--orange)}#checkout-form{min-height:280px}#checkout-form:empty:after{content:'Carregando formulário seguro...';color:#63718a}</style></head><body><header>Canção de Fé</header><main><a href="formulario.html">← Voltar ao formulário</a><h1>Finalize sua homenagem</h1><p class="muted" style="text-align:center">Pagamento único e seguro, processado pela Stripe.</p><section class="card"><h2>Resumo do pedido</h2><div class="summary" id="summary"></div></section><section class="card"><h2>Pagamento</h2><p class="muted">O Pix será exibido se estiver disponível e habilitado na sua conta Stripe.</p><div id="checkout-form"></div><p id="error" class="error" role="alert"></p></section></main><script>
let order={};try{order=JSON.parse(sessionStorage.getItem('cdf_pedido')||'{}')}catch(e){}
const fields=[['recipient','Para'],['name','Nome'],['genre','Estilo'],['voice','Voz'],['qualities','Qualidades'],['memories','Memórias'],['message','Mensagem'],['email','E-mail'],['phone','WhatsApp']];
document.getElementById('summary').textContent=fields.map(([k,label])=>label+': '+(k==='genre'&&order.genre==='Outro estilo'?(order.genreOther||'-'):(order[k]||'-'))).join('\n')+'\n\nValor base: R$ 47,00';
const errorEl=document.getElementById('error');
async function start(){try{if(!order.email)throw Error('Preencha o formulário antes de pagar.');const response=await fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order})});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível iniciar o pagamento.');if(!data.publishable_key||!data.client_secret)throw Error('Chave pública ou sessão Stripe indisponível.');const stripe=Stripe(data.publishable_key);const clientSecret=Promise.resolve(data.client_secret);const checkout=stripe.initCheckoutFormSdk({clientSecret,appearance:{theme:'stripe',labels:'auto',inputs:'spaced',variables:{colorPrimary:'#bd4b24',colorText:'#142038',colorBackground:'#ffffff',borderRadius:'8px'}}});const form=checkout.createForm({layout:'expanded'});form.mount('#checkout-form');const loaded=await checkout.loadActions();if(loaded.type==='success'){form.on('confirm',async event=>{try{const result = await loaded.actions.confirm({
  formConfirmEvent: event,
  returnUrl: window.location.origin + "/sucesso.html"
});if(result?.error)errorEl.textContent=result.error.message||'Pagamento não concluído.'}catch(e){errorEl.textContent=e.message||'Falha ao confirmar pagamento.'}})}else throw Error('Não foi possível carregar o checkout.')}catch(e){errorEl.textContent=e.message||'Erro ao carregar checkout.'}}
start();</script></body></html>

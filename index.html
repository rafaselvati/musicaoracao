<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canção de Fé | Música personalizada</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--cream:#fffbee;--navy:#142038;--orange:#bd4b24;--line:#e3d4c4;--muted:#63718a}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:'DM Sans',Arial,sans-serif;background:linear-gradient(180deg,var(--cream),#fff 92%)}header{padding:22px 24px;border-bottom:1px solid #eee4d4;text-align:center;font:600 27px 'Playfair Display',Georgia,serif}main{max-width:730px;margin:0 auto;padding:38px 20px 80px;min-height:80vh}.progress{height:5px;background:#e6ded4;border-radius:8px;overflow:hidden}.bar{height:100%;width:20%;background:var(--orange);transition:width .2s}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:12px}.panel{padding-top:72px}h1{font:600 clamp(30px,5vw,42px) 'Playfair Display',Georgia,serif;text-align:center;margin:0 0 7px}p.sub{text-align:center;color:#52617b;margin:0 0 34px;line-height:1.6}label{display:block;font-weight:600;margin:21px 0 10px}.required{color:#e34a45}.chips{display:flex;flex-wrap:wrap;gap:11px}.chip{border:1px solid var(--line);background:white;border-radius:30px;padding:12px 19px;font:inherit;color:var(--navy);cursor:pointer}.chip.selected{background:#fae8df;border-color:var(--orange);color:#a63c1b}input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:17px 19px;color:var(--navy);background:white}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus{outline:2px solid #d47a56;outline-offset:1px}small{display:block;color:var(--muted);margin-top:7px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:36px;gap:16px}button{font:600 16px 'DM Sans',Arial,sans-serif;cursor:pointer;border-radius:13px;padding:15px 25px}button.primary{border:1px solid var(--orange);background:var(--orange);color:white}button.secondary{border:1px solid var(--line);background:#fff;color:var(--navy)}button:disabled{opacity:.35;cursor:not-allowed}.error{color:#a32622;min-height:24px;margin-top:12px}.notice{background:#f1f8f0;border:1px solid #c8e5d0;border-radius:14px;padding:20px;line-height:1.6;margin:18px 0}.summary{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}.hidden{display:none!important}a{color:var(--orange)}@media(max-width:600px){.panel{padding-top:42px}.actions button{padding:13px 20px}} .checkout-frame{width:100%;height:820px;border:1px solid var(--line);border-radius:16px;background:#fff;display:block}.checkout-area{margin:25px 0}.checkout-fallback{margin:14px 0;line-height:1.6}.checkout-fallback a{font-weight:700}.checkout-warning{color:#65738b;font-size:13px}@media(max-width:600px){.checkout-frame{height:900px}}.extras{margin-top:22px;border:1px solid var(--line);padding:20px;border-radius:15px;background:#fff}.extras h2{font:600 24px 'Playfair Display',Georgia,serif;margin:0 0 12px}.extra{display:flex;gap:13px;align-items:flex-start;padding:14px 0;border-top:1px solid #f0e6da;margin:0;cursor:pointer}.extra input{width:20px;height:20px;flex:none;accent-color:var(--orange);margin:2px 0}.extra small{margin-top:3px}.price-row{display:flex;justify-content:space-between;align-items:center;margin:25px 0;font-size:20px}.price-row strong{font-size:28px}.pix-note{border:1px solid #b9dcc4;background:#f2faf4;border-radius:14px;padding:16px 20px;margin-bottom:20px}.pix-note p{margin:5px 0 0;line-height:1.5;color:#435e4c;font-size:14px}</style></head><body><header>Canção de Fé</header><main><div id="progressWrap"><div class="progress"><div class="bar" id="bar"></div></div><div class="progress-label"><span id="stepLabel">Etapa 1 de 5</span><span id="percent">20% concluído</span></div></div><section id="stepPanel" class="panel"></section><div class="footer">Seus dados permanecem neste navegador durante o preenchimento. Nenhum pedido é salvo em banco de dados.</div></main><script>
// CONFIGURAÇÃO: preencha antes de publicar. Não use dados reais de clientes em testes.
const CONFIG={checkoutUrl:'https://pay.hotmart.com/E108285645P?checkoutMode=2',emailPedidos:'',whatsappPedidos:''}; // WhatsApp com DDI e DDD, somente números.
const state={recipient:'',name:'',genre:'',qualities:'',memories:'',message:'',email:'',phone:'',bumpExpress:false,bumpPdf:false};let step=0;
const recipients=['Esposa','Marido','Filhos','Mãe','Pai','Namorada','Namorado','Irmão ou irmã','Amigo(a)','Para mim','Outro'];const genres=['Pop','Country','Rock','R&B','Jazz','Louvor','Rap / Hip-Hop'];
const el=document.getElementById('stepPanel');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function chips(field,opts){return '<div class="chips">'+opts.map(o=>`<button type="button" class="chip ${state[field]===o?'selected':''}" data-field="${field}" data-value="${esc(o)}">${esc(o)}</button>`).join('')+'</div>'}function field(name,label,placeholder,type='textarea',help=''){return `<label for="${name}">${label}</label>${type==='textarea'?`<textarea id="${name}" placeholder="${esc(placeholder)}">${esc(state[name])}</textarea>`:`<input id="${name}" type="${type}" value="${esc(state[name])}" placeholder="${esc(placeholder)}">`}${help?`<small>${help}</small>`:''}`}
function save(){for(const name of ['name','qualities','memories','message','email','phone']){const input=document.getElementById(name);if(input)state[name]=input.value.trim()}}function details(){return `CANÇÃO DE FÉ — SOLICITAÇÃO DE MÚSICA\n\nPara: ${state.recipient}\nNome: ${state.name}\nEstilo: ${state.genre}\nQualidades: ${state.qualities||'Não informado'}\nMemórias: ${state.memories||'Não informado'}\nMensagem: ${state.message||'Não informado'}\n\nE-mail: ${state.email}\nTelefone: ${state.phone}\n\nIMPORTANTE: pedido sujeito à confirmação manual do pagamento.`}function render(){document.getElementById('progressWrap').classList.toggle('hidden',step>4);document.getElementById('bar').style.width=((step+1)*20)+'%';document.getElementById('stepLabel').textContent=`Etapa ${step+1} de 5`;document.getElementById('percent').textContent=`${(step+1)*20}% concluído`;let html='';if(step===0)html=`<h1>Vamos começar pelo básico</h1><p class="sub">Conte-nos sobre a pessoa especial da sua vida.</p><label>Para quem é esta música? <span class="required">*</span></label>${chips('recipient',recipients)}${field('name','Qual é o nome dessa pessoa?','Digite o primeiro nome','text','Dica: inclua a pronúncia do nome, se necessário.')}`;if(step===1)html=`<h1>Escolha um estilo musical</h1><p class="sub">Qual estilo combina melhor com a sua homenagem?</p><label>Estilo preferido <span class="required">*</span></label>${chips('genre',genres)}`;if(step===2)html=`<h1>O que torna essa pessoa especial?</h1><p class="sub">Descreva a personalidade e as qualidades que você mais admira.</p>${field('qualities','Suas melhores qualidades','É paciente, sábia, divertida, protetora ou encorajadora? O que faz dela uma pessoa incrível?')}`;if(step===3)html=`<h1>Compartilhe suas melhores lembranças</h1><p class="sub">Quais momentos ao lado dessa pessoa você guarda no coração?</p>${field('memories','Momentos especiais juntos','Conte como vocês se conheceram, histórias marcantes, brincadeiras ou lembranças que tornam essa relação única...')}`;if(step===4)html=`<h1>Uma mensagem do seu coração</h1><p class="sub">Escreva o que mais gostaria de incluir na canção. Faremos o possível para incorporar sua mensagem.</p>${field('message','Mensagem especial','O que você quer que essa pessoa saiba, sinta ou lembre?')}`;if(step===5)html=`<h1>Estamos quase lá!</h1><p class="sub">Informe seus dados de contato para combinarmos a entrega.</p>${field('email','Seu e-mail *','voce@exemplo.com','email')}${field('phone','Seu telefone / WhatsApp *','(62) 99999-9999','tel')}<div class="notice">Sua música será produzida manualmente após a confirmação do pagamento. A entrega será combinada por e-mail ou WhatsApp.</div>`;if(step===6)html=`<h1>Finalize sua homenagem</h1><p class="sub">Revise as informações e escolha os adicionais.</p><div class="summary">${esc(details())}</div><div class="extras"><h2>Personalize seu pedido</h2><label class="extra"><input type="checkbox" id="bumpExpress" ${state.bumpExpress?'checked':''}> <span><b>Produção prioritária</b><small>+ R$ 19,90 · sujeito à disponibilidade</small></span></label><label class="extra"><input type="checkbox" id="bumpPdf" ${state.bumpPdf?'checked':''}> <span><b>Letra da música em PDF</b><small>+ R$ 9,90</small></span></label></div><div class="price-row"><span>Total previsto</span><strong id="totalValue"></strong></div><div class="pix-note"><b>Pix em destaque</b><p>O método de pagamento efetivamente disponível será definido pela dLocal Go após a ativação da API de cobrança.</p></div><div class="notice"><b>Ambiente de testes:</b> a integração de autenticação dLocal Go Sandbox está pronta. O pagamento está desativado até confirmarmos os endpoints de criação de cobrança e a validação de notificações. Nenhum valor será cobrado nesta página.</div><div class="extras"><h2>Forma de pagamento</h2><label class="extra"><input type="radio" name="payMethod" value="pix" checked><span><b>Pix — preferencial</b><small>Pagamento instantâneo, após a ativação da cobrança</small></span></label><label class="extra"><input type="radio" name="payMethod" value="card"><span><b>Cartão de crédito</b><small>Campos seguros serão disponibilizados pela dLocal Go</small></span></label></div><button type="button" class="primary" id="previewPayment">Validar pedido de teste</button><p id="paymentResult" aria-live="polite"></p><button type="button" class="secondary" id="testApi">Testar conexão com dLocal Go Sandbox</button><p id="apiResult" aria-live="polite"></p><div class="actions"><button class="secondary" id="back">← Voltar</button></div>`;if(step<=5)html+=`<div class="actions"><button class="secondary" id="back" ${step===0?'disabled':''}>← Voltar</button><button class="primary" id="next">${step===5?'Revisar pedido':'Próximo →'}</button></div><p class="error" id="error"></p>`;el.innerHTML=html;if(step===6){const updateTotal=()=>{document.getElementById('totalValue').textContent=(47+(state.bumpExpress?19.9:0)+(state.bumpPdf?9.9:0)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};for(const [id,key] of [['bumpExpress','bumpExpress'],['bumpPdf','bumpPdf']]){document.getElementById(id).addEventListener('change',e=>{state[key]=e.target.checked;updateTotal()})}updateTotal();document.getElementById('previewPayment').addEventListener('click',async()=>{const out=document.getElementById('paymentResult');const btn=document.getElementById('previewPayment');btn.disabled=true;out.textContent='Validando pedido no servidor...';try{const method=document.querySelector('input[name=payMethod]:checked').value;const r=await fetch('/api/payment-preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:state.name,email:state.email,phone:state.phone,method,bumpExpress:state.bumpExpress,bumpPdf:state.bumpPdf})});const j=await r.json();out.textContent=r.ok?('Total validado: R$ '+j.amount+'. '+j.message):(j.message||'Falha na validação');out.style.color=r.ok?'#23683b':'#a32622'}catch(e){out.textContent='Erro ao validar o pedido. Faça o teste na Vercel.';out.style.color='#a32622'}finally{btn.disabled=false}});document.getElementById('testApi').addEventListener('click',async()=>{const el=document.getElementById('apiResult');el.textContent='Verificando conexão...';try{const r=await fetch('/api/dlocal-status');const j=await r.json();el.textContent=j.message||'Sem resposta';el.style.color=r.ok?'#23683b':'#a32622'}catch(e){el.textContent='Falha de conexão. Execute pela Vercel ou com vercel dev.';el.style.color='#a32622'}})}el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{save();state[b.dataset.field]=b.dataset.value;render()}));document.getElementById('back')?.addEventListener('click',()=>{save();step--;render()});document.getElementById('next')?.addEventListener('click',()=>{save();let err='';if(step===0&&(!state.recipient||!state.name))err='Selecione o destinatário e informe o nome.';if(step===1&&!state.genre)err='Selecione o estilo musical.';if(step===5&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)||state.phone.replace(/\D/g,'').length<10))err='Informe um e-mail válido e telefone com DDD.';if(err){document.getElementById('error').textContent=err;return}step++;render()});document.getElementById('emailSend')?.addEventListener('click',()=>{if(!CONFIG.emailPedidos){document.getElementById('error').textContent='Configure emailPedidos no arquivo index.html.';return}location.href=`mailto:${CONFIG.emailPedidos}?subject=${encodeURIComponent('Pedido Canção de Fé — '+state.name)}&body=${encodeURIComponent(details())}`});document.getElementById('waSend')?.addEventListener('click',()=>{if(!CONFIG.whatsappPedidos){document.getElementById('error').textContent='Configure whatsappPedidos no arquivo index.html.';return}window.open('https://wa.me/'+CONFIG.whatsappPedidos+'?text='+encodeURIComponent(details()),'_blank','noopener,noreferrer')})}render();
</script></body></html>

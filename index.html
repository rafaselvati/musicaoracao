<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canção de Fé | Música personalizada</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--cream:#fffbee;--navy:#142038;--orange:#bd4b24;--line:#e3d4c4;--muted:#63718a}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:'DM Sans',Arial,sans-serif;background:linear-gradient(180deg,var(--cream),#fff 92%)}header{padding:22px 24px;border-bottom:1px solid #eee4d4;text-align:center;font:600 27px 'Playfair Display',Georgia,serif}main{max-width:730px;margin:0 auto;padding:38px 20px 80px;min-height:80vh}.progress{height:5px;background:#e6ded4;border-radius:8px;overflow:hidden}.bar{height:100%;width:20%;background:var(--orange);transition:width .2s}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:12px}.panel{padding-top:72px}h1{font:600 clamp(30px,5vw,42px) 'Playfair Display',Georgia,serif;text-align:center;margin:0 0 7px}p.sub{text-align:center;color:#52617b;margin:0 0 34px;line-height:1.6}label{display:block;font-weight:600;margin:21px 0 10px}.required{color:#e34a45}.chips{display:flex;flex-wrap:wrap;gap:11px}.chip{border:1px solid var(--line);background:white;border-radius:30px;padding:12px 19px;font:inherit;color:var(--navy);cursor:pointer}.chip.selected{background:#fae8df;border-color:var(--orange);color:#a63c1b}input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:17px 19px;color:var(--navy);background:white}textarea{min-height:150px;resize:vertical}input:focus,textarea:focus{outline:2px solid #d47a56;outline-offset:1px}small{display:block;color:var(--muted);margin-top:7px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:36px;gap:16px}button{font:600 16px 'DM Sans',Arial,sans-serif;cursor:pointer;border-radius:13px;padding:15px 25px}button.primary{border:1px solid var(--orange);background:var(--orange);color:white}button.secondary{border:1px solid var(--line);background:#fff;color:var(--navy)}button:disabled{opacity:.35;cursor:not-allowed}.error{color:#a32622;min-height:24px;margin-top:12px}.notice{background:#f1f8f0;border:1px solid #c8e5d0;border-radius:14px;padding:20px;line-height:1.6;margin:18px 0}.summary{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}.hidden{display:none!important}a{color:var(--orange)}@media(max-width:600px){.panel{padding-top:42px}.actions button{padding:13px 20px}} .hotmart__button-checkout{display:inline-flex;align-items:center;justify-content:center;background:var(--orange);color:#fff;text-decoration:none;border-radius:13px;padding:15px 25px;font-weight:700;cursor:pointer}.hotmart__button-checkout img{display:none}</style></head><body><header>Canção de Fé</header><main><div id="progressWrap"><div class="progress"><div class="bar" id="bar"></div></div><div class="progress-label"><span id="stepLabel">Etapa 1 de 5</span><span id="percent">20% concluído</span></div></div><section id="stepPanel" class="panel"></section><div id="hotmartAnchorHome" class="hidden"><a href="https://pay.hotmart.com/E108285645P?checkoutMode=2" class="hotmart-fb hotmart__button-checkout" id="pay" aria-label="Pagar com segurança">Pagar com segurança →</a></div><div class="footer">Seus dados permanecem neste navegador durante o preenchimento. Nenhum pedido é salvo em banco de dados.</div></main><script>
// CONFIGURAÇÃO: preencha antes de publicar. Não use dados reais de clientes em testes.
const CONFIG={checkoutUrl:'https://pay.hotmart.com/E108285645P?checkoutMode=2',emailPedidos:'',whatsappPedidos:''}; // WhatsApp com DDI e DDD, somente números.
const state={recipient:'',name:'',genre:'',qualities:'',memories:'',message:'',email:'',phone:''};let step=0;
const recipients=['Esposa','Marido','Filhos','Mãe','Pai','Namorada','Namorado','Irmão ou irmã','Amigo(a)','Para mim','Outro'];const genres=['Pop','Country','Rock','R&B','Jazz','Louvor','Rap / Hip-Hop'];
const el=document.getElementById('stepPanel');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function chips(field,opts){return '<div class="chips">'+opts.map(o=>`<button type="button" class="chip ${state[field]===o?'selected':''}" data-field="${field}" data-value="${esc(o)}">${esc(o)}</button>`).join('')+'</div>'}function field(name,label,placeholder,type='textarea',help=''){return `<label for="${name}">${label}</label>${type==='textarea'?`<textarea id="${name}" placeholder="${esc(placeholder)}">${esc(state[name])}</textarea>`:`<input id="${name}" type="${type}" value="${esc(state[name])}" placeholder="${esc(placeholder)}">`}${help?`<small>${help}</small>`:''}`}
function save(){for(const name of ['name','qualities','memories','message','email','phone']){const input=document.getElementById(name);if(input)state[name]=input.value.trim()}}function details(){return `CANÇÃO DE FÉ — SOLICITAÇÃO DE MÚSICA\n\nPara: ${state.recipient}\nNome: ${state.name}\nEstilo: ${state.genre}\nQualidades: ${state.qualities||'Não informado'}\nMemórias: ${state.memories||'Não informado'}\nMensagem: ${state.message||'Não informado'}\n\nE-mail: ${state.email}\nTelefone: ${state.phone}\n\nIMPORTANTE: pedido sujeito à confirmação manual do pagamento.`}function render(){document.getElementById('progressWrap').classList.toggle('hidden',step>4);document.getElementById('bar').style.width=((step+1)*20)+'%';document.getElementById('stepLabel').textContent=`Etapa ${step+1} de 5`;document.getElementById('percent').textContent=`${(step+1)*20}% concluído`;let html='';if(step===0)html=`<h1>Vamos começar pelo básico</h1><p class="sub">Conte-nos sobre a pessoa especial da sua vida.</p><label>Para quem é esta música? <span class="required">*</span></label>${chips('recipient',recipients)}${field('name','Qual é o nome dessa pessoa?','Digite o primeiro nome','text','Dica: inclua a pronúncia do nome, se necessário.')}`;if(step===1)html=`<h1>Escolha um estilo musical</h1><p class="sub">Qual estilo combina melhor com a sua homenagem?</p><label>Estilo preferido <span class="required">*</span></label>${chips('genre',genres)}`;if(step===2)html=`<h1>O que torna essa pessoa especial?</h1><p class="sub">Descreva a personalidade e as qualidades que você mais admira.</p>${field('qualities','Suas melhores qualidades','É paciente, sábia, divertida, protetora ou encorajadora? O que faz dela uma pessoa incrível?')}`;if(step===3)html=`<h1>Compartilhe suas melhores lembranças</h1><p class="sub">Quais momentos ao lado dessa pessoa você guarda no coração?</p>${field('memories','Momentos especiais juntos','Conte como vocês se conheceram, histórias marcantes, brincadeiras ou lembranças que tornam essa relação única...')}`;if(step===4)html=`<h1>Uma mensagem do seu coração</h1><p class="sub">Escreva o que mais gostaria de incluir na canção. Faremos o possível para incorporar sua mensagem.</p>${field('message','Mensagem especial','O que você quer que essa pessoa saiba, sinta ou lembre?')}`;if(step===5)html=`<h1>Estamos quase lá!</h1><p class="sub">Informe seus dados de contato para combinarmos a entrega.</p>${field('email','Seu e-mail *','voce@exemplo.com','email')}${field('phone','Seu telefone / WhatsApp *','(62) 99999-9999','tel')}<div class="notice">Sua música será produzida manualmente após a confirmação do pagamento. A entrega será combinada por e-mail ou WhatsApp.</div>`;if(step===6)html=`<h1>Confira seu pedido</h1><p class="sub">Revise as informações antes de seguir para o pagamento.</p><div class="summary">${esc(details())}</div><div class="notice"><b>Pagamento:</b> o pagamento é processado pelo widget oficial da Hotmart. Não coletamos dados de cartão aqui. O pedido só estará confirmado após a aprovação pela Hotmart.</div><div class="actions"><button class="secondary" id="back">← Voltar</button><span id="hotmartPaySlot"></span></div><div class="actions"><button class="secondary" id="emailSend">Enviar pedido por e-mail</button><button class="secondary" id="waSend">Enviar por WhatsApp</button></div><small>Importante: o widget de pagamento não envia automaticamente os dados do formulário à Hotmart. Para garantir o recebimento do pedido, envie o resumo após o pagamento. O botão de e-mail abre seu aplicativo de e-mail; o de WhatsApp abre uma conversa. O envio não é automático.</small><p class="error" id="error"></p>`;if(step<=5)html+=`<div class="actions"><button class="secondary" id="back" ${step===0?'disabled':''}>← Voltar</button><button class="primary" id="next">${step===5?'Revisar pedido':'Próximo →'}</button></div><p class="error" id="error"></p>`;el.innerHTML=html;const slot=document.getElementById('hotmartPaySlot');const pay=document.getElementById('pay');if(slot&&pay)slot.appendChild(pay);else if(pay)document.getElementById('hotmartAnchorHome').appendChild(pay);el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{save();state[b.dataset.field]=b.dataset.value;render()}));document.getElementById('back')?.addEventListener('click',()=>{save();step--;render()});document.getElementById('next')?.addEventListener('click',()=>{save();let err='';if(step===0&&(!state.recipient||!state.name))err='Selecione o destinatário e informe o nome.';if(step===1&&!state.genre)err='Selecione o estilo musical.';if(step===5&&(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)||state.phone.replace(/\D/g,'').length<10))err='Informe um e-mail válido e telefone com DDD.';if(err){document.getElementById('error').textContent=err;return}step++;render()});document.getElementById('emailSend')?.addEventListener('click',()=>{if(!CONFIG.emailPedidos){document.getElementById('error').textContent='Configure emailPedidos no arquivo index.html.';return}location.href=`mailto:${CONFIG.emailPedidos}?subject=${encodeURIComponent('Pedido Canção de Fé — '+state.name)}&body=${encodeURIComponent(details())}`});document.getElementById('waSend')?.addEventListener('click',()=>{if(!CONFIG.whatsappPedidos){document.getElementById('error').textContent='Configure whatsappPedidos no arquivo index.html.';return}window.open('https://wa.me/'+CONFIG.whatsappPedidos+'?text='+encodeURIComponent(details()),'_blank','noopener,noreferrer')})}render();
</script><link rel="stylesheet" href="https://static.hotmart.com/css/hotmart-fb.min.css"><script defer src="https://static.hotmart.com/checkout/widget.min.js"></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar fotos | Canção de Fé</title><style>body{font-family:system-ui,sans-serif;background:#f8f4ee;color:#302b28;margin:0;padding:24px}.wrap{max-width:620px;margin:35px auto;background:white;border-radius:18px;padding:30px;box-shadow:0 12px 35px #0001}h1{color:#754e30}p{line-height:1.5}.drop{border:2px dashed #bb9c7a;padding:22px;border-radius:12px;background:#fcfaf7}input{max-width:100%}button{background:#76502f;color:white;border:0;border-radius:9px;padding:15px 24px;font-size:16px;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}#preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}#preview img{width:100%;height:115px;object-fit:cover;border-radius:8px}#status{margin-top:15px;white-space:pre-line}</style></head><body><main class="wrap"><h1>Envie as fotos do seu vídeo</h1><p>Seu vídeo personalizado será produzido com as fotos que você escolher. Selecione <strong>de 1 a 6 fotos</strong> (JPG, PNG ou WEBP, até 2 MB cada).</p><div class="drop"><label for="photos"><strong>Escolher fotos</strong></label><p><input type="file" id="photos" accept="image/jpeg,image/png,image/webp" multiple></p><div id="preview"></div></div><button id="send">Enviar minhas fotos</button><p id="status" role="status" aria-live="polite"></p><p><small>Use somente fotos que você tem autorização para compartilhar. As imagens serão encaminhadas por e-mail para a produção do seu pedido.</small></p></main><script>
const params=new URLSearchParams(location.search),input=document.getElementById('photos'),preview=document.getElementById('preview'),status=document.getElementById('status'),button=document.getElementById('send');
if(!params.get('sessionId')||!params.get('expires')||!params.get('signature')){button.disabled=true;status.textContent='Link inválido. Use o link enviado no seu e-mail após o pagamento.'}
input.onchange=()=>{preview.replaceChildren();for(const file of [...input.files].slice(0,6)){const img=document.createElement('img');img.alt='Foto selecionada';img.src=URL.createObjectURL(file);img.onload=()=>URL.revokeObjectURL(img.src);preview.append(img)}};
button.onclick=async()=>{const files=[...input.files];if(files.length<1||files.length>6||files.some(f=>f.size>2000000||!['image/jpeg','image/png','image/webp'].includes(f.type))){status.textContent='Selecione de 1 a 6 fotos JPG, PNG ou WEBP de até 2 MB cada.';return}button.disabled=true;status.textContent='Enviando fotos...';try{const photos=await Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({type:f.type,data:String(r.result).split(',')[1]});r.onerror=reject;r.readAsDataURL(f)})));const response=await fetch('/api/enviar-fotos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:params.get('sessionId'),expires:params.get('expires'),signature:params.get('signature'),photos})});const result=await response.json();if(!response.ok)throw Error(result.error||'Falha no envio');status.textContent='Fotos enviadas com sucesso! Obrigado. Seu pedido está pronto para produção.';input.disabled=true;button.hidden=true}catch(e){status.textContent=e.message;button.disabled=false}};
</script></body></html>
